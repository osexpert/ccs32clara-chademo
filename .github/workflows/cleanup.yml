name: Delete old workflow runs
on:
  schedule:
    - cron: "0 3 * * *" # every nigth
  workflow_dispatch:
jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: "pages-build-deployment|Delete old workflow runs"
          retain_days: 0
          keep_minimum_runs: 1